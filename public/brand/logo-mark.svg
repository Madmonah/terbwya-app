<svg width="480" height="480" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F77F00"/>
      <stop offset="100%" stop-color="#D62828"/>
    </linearGradient>
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FCBF49" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FCBF49" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <circle cx="240" cy="240" r="230" fill="#FFF8F0"/>
  <circle cx="240" cy="240" r="230" fill="none" stroke="#FCBF49" stroke-width="5" opacity="0.5"/>

  <!-- steam wisps -->
  <path d="M175 175 C165 155, 185 140, 175 118 C165 96, 185 82, 178 62"
        fill="none" stroke="url(#steamGrad)" stroke-width="11" stroke-linecap="round"/>
  <path d="M240 168 C230 145, 252 128, 242 102 C232 78, 254 64, 246 42"
        fill="none" stroke="url(#steamGrad)" stroke-width="12" stroke-linecap="round"/>
  <path d="M305 175 C315 155, 295 140, 305 118 C315 96, 295 82, 302 62"
        fill="none" stroke="url(#steamGrad)" stroke-width="11" stroke-linecap="round"/>

  <!-- bowl -->
  <path d="M108 235 Q108 372 240 372 Q372 372 372 235 Z" fill="url(#bowlGrad)"/>
  <ellipse cx="240" cy="235" rx="132" ry="28" fill="#A31E1E"/>
  <ellipse cx="240" cy="230" rx="122" ry="21" fill="#FCBF49"/>

  <!-- bowl base -->
  <path d="M202 372 L213 400 Q240 408 267 400 L278 372 Z" fill="#A31E1E"/>

  <!-- Bold ت letterform, oversized and centered on the rim -->
  <g transform="translate(240 231)">
    <path d="M-58 6 L58 6" stroke="#FFF8F0" stroke-width="20" stroke-linecap="round"/>
    <circle cx="-20" cy="-26" r="9" fill="#FFF8F0"/>
    <circle cx="20" cy="-26" r="9" fill="#FFF8F0"/>
  </g>
</svg>
